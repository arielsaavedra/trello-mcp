name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: cd cli && go vet ./...

      - name: Test
        run: cd cli && go test -race ./...

      - name: Build
        run: sh scripts/build-local.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup helper tests
        run: python3 scripts/test_setup.py
